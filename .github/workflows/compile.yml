
name: Compilar Blackjack Challenge

on:
  workflow_dispatch:
  push:
    paths:
      - 'blackjack_challenge_mod.zip'

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4

      - name: Configurar Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Instalar Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'

      - name: Descomprimir mod
        run: |
          unzip -q blackjack_challenge_mod.zip -d extracted

      - name: Compilar mod
        run: |
          gradle -p extracted/blackjack_challenge_mod build

      - name: Guardar JAR
        uses: actions/upload-artifact@v4
        with:
          name: Blackjack-Challenge
          path: extracted/blackjack_challenge_mod/build/libs/*.jar
          
